name: Build and test Authlib Injector

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Test and shadowJar
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean test shadowJar
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: authlib-injector-test-build
          path: build/libs/*
          if-no-files-found: error
          retention-days: 7
